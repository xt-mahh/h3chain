<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>h3chain — MiniMax H3 无限长视频生成</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --ok: #3fb950; --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px; max-width: 1080px; margin: 0 auto;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  h1 .badge { font-size: 12px; color: var(--accent); border: 1px solid var(--accent);
              border-radius: 10px; padding: 2px 8px; margin-left: 8px; vertical-align: middle; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    gap: 14px; align-items: start;
  }
  .col-left, .col-mid, .col-right { min-width: 0; }
  .col-left, .col-right { position: sticky; top: 16px; }
  .col-left { display: flex; flex-direction: column; gap: 14px; }
  .col-left .panel { margin: 0 !important; }
  .col-right { display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 32px); overflow-y: auto; }
  .col-right .panel { margin: 0 !important; flex-shrink: 0; }
  .panel { background: var(--panel); border: 1px solid var(--border);
           border-radius: 8px; padding: 16px; }
  #preview-video { width: 100%; border-radius: 6px; background: #000; display: block; }
  #preview-meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .clip-card .timer { color: var(--accent); font-variant-numeric: tabular-nums; }
  .st.gen { color: #e6a700; } .st.error { color: #ff6b6b; }
  #editor-scroll {
    max-height: calc(100vh - 320px); overflow-y: auto;
    padding-right: 6px; border-radius: 6px;
  }
  #editor-scroll::-webkit-scrollbar { width: 8px; }
  #editor-scroll::-webkit-scrollbar-thumb {
    background: var(--border); border-radius: 4px; }
  #reflist li img.thumb {
    width: 52px; height: 52px; object-fit: cover; border-radius: 4px;
    cursor: zoom-in; display: block;
  }
  #ref-modal {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.82); align-items: center; justify-content: center;
    cursor: zoom-out;
  }
  #ref-modal img { max-width: 94vw; max-height: 94vh; border-radius: 8px; }
  .panel h2 { font-size: 14px; color: var(--muted); margin-bottom: 12px;
              text-transform: uppercase; letter-spacing: .5px; }
  input[type=text], input[type=number] {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px;
    font-size: 13px; margin-bottom: 8px;
  }
  textarea.prompt {
    width: 100%; min-height: 170px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 10px;
    font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.5;
    resize: vertical;
  }
  button {
    background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer;
    width: 100%; margin-bottom: 6px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: #1f6feb; border-color: #1f6feb; font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.row { width: auto; display: inline-block; margin-right: 6px; }
  button.mini { width: auto; padding: 3px 10px; font-size: 12px; margin: 0; }
  ul#projects { list-style: none; max-height: 200px; overflow-y: auto; }
  ul#projects li {
    padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
  ul#projects li:hover { background: var(--bg); }
  ul#projects li.active { background: #1c2940; outline: 1px solid var(--accent); }
  ul#projects li .pdel {
    color: var(--err); cursor: pointer; font-size: 12px;
    padding: 2px 6px; border-radius: 4px; display: none;
  }
  ul#projects li:hover .pdel { display: inline; }
  ul#projects li .pdel:hover { background: rgba(248,81,73,.15); }
  #reflist { list-style: none; margin: 8px 0; }
  #reflist li {
    font-size: 12px; color: var(--muted); padding: 4px 8px;
    display: flex; justify-content: space-between; align-items: center;
    border: 1px dashed var(--border); border-radius: 6px; margin-bottom: 4px;
  }
  #reflist li .del { color: var(--err); cursor: pointer; padding: 0 4px; }
  .clips { margin-top: 4px; }
  .clip-card {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 12px; background: var(--bg);
  }
  .clip-card.locked { border-color: #238636; }
  .clip-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
    font-size: 13px; flex-wrap: wrap;
  }
  .clip-head .cid { font-family: ui-monospace, monospace; color: var(--accent); }
  .clip-head .st { font-size: 12px; }
  .clip-head .st.done { color: var(--ok); }
  .clip-head .st.pending { color: var(--warn); }
  .clip-head .spacer { flex: 1; }
  .clip-head label { color: var(--muted); font-size: 12px; }
  .clip-head input[type=number] {
    width: 74px; margin: 0; padding: 4px 6px; font-size: 12px;
  }
  .settings-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .settings-row .fld { flex: 1; min-width: 110px; }
  .settings-row label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 3px; }
  .settings-row input { margin-bottom: 0; }
  #progress {
    font-size: 13px; color: var(--accent); margin-top: 8px; min-height: 20px;
    font-family: ui-monospace, monospace;
  }
  #log {
    margin-top: 10px; font-size: 12px; color: var(--muted);
    max-height: 130px; overflow-y: auto; font-family: ui-monospace, monospace;
    border-top: 1px dashed var(--border); padding-top: 8px;
  }
  #preview-video { width: 100%; border-radius: 6px; background: #000; display: block; max-height: 340px; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.6; }
  .err-box { color: var(--err); font-size: 12px; margin-top: 8px;
             white-space: pre-wrap; font-family: ui-monospace, monospace; }
  details.raw { margin-top: 10px; }
  details.raw summary { color: var(--muted); font-size: 12px; cursor: pointer; }
  details.raw textarea {
    width: 100%; min-height: 260px; margin-top: 8px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 10px;
    font-family: ui-monospace, monospace; font-size: 11px;
  }
</style>
</head>
<body>
<h1>h3chain <span class="badge">无限长视频</span></h1>
<div class="sub">MiniMax H3 · clip-by-clip 链式生成 · keep/redo 逐段打磨 · 已锁定片段磁盘缓存秒回</div>

<div class="grid">
  <!-- 左栏：工程 / refs -->
  <div class="col-left">
    <div class="panel">
      <h2>工程</h2>
      <ul id="projects"></ul>
      <div style="display:flex; gap:6px; margin-top:10px;">
        <input type="text" id="newname" placeholder="新工程名" style="margin-bottom:0;">
        <button class="row" style="width:auto;" onclick="createProject()">新建</button>
      </div>
    </div>

    <div class="panel">
      <h2>参考图 (refs)</h2>
      <ul id="reflist"></ul>
      <input type="file" id="reffile" accept=".png,.jpg,.jpeg" multiple
             style="font-size:12px; color:var(--muted); margin-bottom:8px;">
      <button onclick="uploadRefs()">上传参考图</button>
      <div class="hint" style="margin-top:4px;">
        PNG/JPG ≤ 20MB。<span id="ref-msg"></span>
      </div>
    </div>
  </div>

  <!-- 中栏：预览 + 分段编辑 -->
  <div class="col-mid">
    <div class="panel" id="preview">
      <h2>视频预览</h2>
      <video id="preview-video" controls playsinline autoplay muted></video>
      <div id="preview-meta">尚未生成 — 点击右侧「生成下一个片段」开始</div>
    </div>
    <div class="panel">
      <h2>故事设置 <span class="hint" id="story-file"></span></h2>
      <div class="settings-row">
        <div class="fld"><label>标题</label>
          <input type="text" id="s-title"></div>
        <div class="fld"><label>分辨率 W×H</label>
          <div style="display:flex; gap:6px;">
            <input type="number" id="s-w" style="margin-bottom:0;">
            <input type="number" id="s-h" style="margin-bottom:0;">
          </div></div>
        <div class="fld"><label>steps</label>
          <input type="number" id="s-steps"></div>
        <div class="fld"><label>context</label>
          <input type="text" id="s-ctx" placeholder="22"></div>
      </div>
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px;">
        <h2 style="margin:0; flex:1;">分段 Prompt（每段一个 clip）</h2>
        <button class="mini" onclick="addClip()">+ 加一段</button>
        <button class="mini primary" onclick="saveStory()">保存全部</button>
        <span class="hint" id="save-msg"></span>
      </div>
      <div id="editor-scroll"><div class="clips" id="editor"></div></div>
      <details class="raw">
        <summary>高级：story.json 源码模式</summary>
        <textarea id="story-raw" spellcheck="false"></textarea>
        <div style="display:flex; gap:8px; margin-top:6px;">
          <button class="mini" onclick="loadRaw()">源码 → 表单</button>
          <button class="mini" onclick="saveRaw()">保存源码</button>
        </div>
      </details>
    </div>
  </div>

  <!-- 右栏：操作 / 进度 / 播放器 -->
  <div class="col-right">
    <div class="panel">
      <h2>操作</h2>
      <button class="primary" id="btn-gen" onclick="doGen()">① 生成下一个片段</button>
      <button onclick="doKeep()">② 满意 → 锁定 (keep)</button>
      <button onclick="doRedo()">不满意 → 重做 (redo，自动换seed)</button>
      <button onclick="doExport()">③ 导出全片 (export)</button>
      <div id="progress"></div>
      <div id="log"></div>
    </div>

    <div class="panel">
      <h2>片段进度</h2>
      <div class="clips" id="clips"></div>
      <div class="err-box" id="err"></div>
    </div>
  </div>
</div>

<div id="ref-modal" onclick="this.style.display='none'">
  <img id="ref-modal-img" alt="ref preview">
</div>

<script>
let current = null;     // 当前工程名
let es = null;          // EventSource
let story = null;       // 内存中的 story 对象（表单双向绑定）
let playFile = null;    // 当前预览文件名
let previewDuration = null;  // 累积时长（秒，来自 done 事件）
let genClock = null;    // 生成中实时计时器 interval
let genClockStart = null;    // 本次生成开始 epoch ms
let lastStatusRow = null;    // 最近一次 status 响应的 clips 行

const $ = id => document.getElementById(id);

async function api(path, opts) {
  const r = await fetch('/api' + path, opts);
  return r.json();
}

async function refreshProjects() {
  const d = await api('/projects');
  const ul = $('projects');
  ul.innerHTML = '';
  for (const p of d.data.projects) {
    const li = document.createElement('li');
    const name = document.createElement('span');
    name.textContent = p;
    name.style.flex = '1';
    name.onclick = () => selectProject(p);
    const del = document.createElement('span');
    del.className = 'pdel'; del.textContent = '✕';
    del.title = '删除工程（含 refs/产物，不可恢复）';
    del.onclick = ev => { ev.stopPropagation(); deleteProject(p); };
    li.append(name, del);
    if (p === current) li.classList.add('active');
    ul.appendChild(li);
  }
}

async function deleteProject(name) {
  if (!confirm(`删除工程「${name}」？\nrefs、story、产物全部删除，不可恢复。`)) return;
  const d = await api(`/projects/${name}`, {method:'DELETE'});
  if (!d.ok) { showErr(d); return; }
  log('project deleted: ' + name);
  if (current === name) { current = null; story = null; }
  await refreshProjects();
}

async function createProject() {
  const name = $('newname').value.trim();
  if (!name) return;
  const d = await api('/projects', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name})});
  if (!d.ok) { showErr(d); return; }
  $('newname').value = '';
  await refreshProjects();
  selectProject(name);
}

async function selectProject(name) {
  current = name;
  $('story-file').textContent = name;
  await refreshProjects();
  await loadStory();
  await refreshRefs();
  await refreshClips();
  await loadLatestOutput();
  openEvents();
}

async function loadLatestOutput() {
  if (!current) return;
  const d = await api(`/projects/${current}/output`);
  if (d.ok && d.data.latest) {
    playVideo(d.data.latest);
    updatePreviewMeta();
  } else {
    const v = $('preview-video');
    v.removeAttribute('src'); v.load();
    $('preview-meta').textContent = '尚未生成 — 点击右侧「生成下一个片段」开始';
  }
}

// ---------------------------------------------------------------- story 表单

async function loadStory() {
  if (!current) return;
  const d = await api(`/projects/${current}/story`);
  if (!d.ok) { showErr(d); return; }
  story = d.data.story;
  storyToForm();
}

function storyToForm() {
  if (!story) return;
  $('s-title').value = story.title || '';
  const [w, h] = story.resolution || [768, 1344];
  $('s-w').value = w; $('s-h').value = h;
  $('s-steps').value = story.steps ?? 8;
  $('s-ctx').value = story.context_length ?? '22';
  renderEditor();
  $('story-raw').value = JSON.stringify(story, null, 2);
}

function renderEditor() {
  const box = $('editor');
  box.innerHTML = '';
  story.clips.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'clip-card' + (c.validated ? ' locked' : '');

    const head = document.createElement('div');
    head.className = 'clip-head';
    const cid = document.createElement('span');
    cid.className = 'cid'; cid.textContent = c.id;
    const st = document.createElement('span');
    const stt = c.status || (c.validated ? 'locked' : 'pending');
    st.className = 'st ' + (stt === 'locked' ? 'done' : stt === 'generated' || stt === 'generating' ? 'gen' : stt === 'error' ? 'error' : 'pending');
    st.textContent = {pending: '… 待处理', generating: '⏳ 生成中', generated: '● 已生成·待审', error: '✗ 出错', locked: '✓ 已锁定'}[stt] || stt;
    const spacer = document.createElement('span');
    spacer.className = 'spacer';
    const durLabel = document.createElement('label');
    durLabel.textContent = '时长s';
    const dur = document.createElement('input');
    dur.type = 'number'; dur.step = '0.25'; dur.min = '0.25'; dur.max = '150';
    dur.value = c.duration;
    dur.onchange = () => { story.clips[i].duration = parseFloat(dur.value) || 5; };
    const del = document.createElement('button');
    del.className = 'mini'; del.textContent = '删';
    del.onclick = () => { story.clips.splice(i, 1); renumber(); renderEditor(); };
    head.append(cid, st, spacer, durLabel, dur, del);
    card.appendChild(head);

    const ta = document.createElement('textarea');
    ta.className = 'prompt'; ta.spellcheck = false;
    ta.value = c.prompt;
    ta.onchange = () => { story.clips[i].prompt = ta.value; };
    ta.oninput = () => { story.clips[i].prompt = ta.value; };
    card.appendChild(ta);

    box.appendChild(card);
  });
}

function renumber() {
  story.clips.forEach((c, i) => {
    const m = c.id.match(/^clip_(\d+)$/);
    if (m) c.id = `clip_${i + 1}`;
  });
}

function addClip() {
  if (!story) return;
  const n = story.clips.length + 1;
  const prev = story.clips[story.clips.length - 1];
  let prompt = '';
  if (prev) {
    // 继承上一段的 subject_definitions（身份锁定）
    const m = prev.prompt.match(/subject_definitions:[\s\S]*?(?=\n\n\w|\n\n\[|$)/);
    prompt = (m ? m[0].trim() + '\n\n' : '') +
      '[integrated_multimodal_description]\n[描述下一段]\n\n' +
      'overall_soundscape:\n[环境声]\n\n' +
      'dialogue_and_sound_effects:\n[台词]\n\n' +
      'non_diegetic_music:\nNone. No background music, no score, no melodic instrument of any kind. This clip is delivered dry (dialogue/VO + ambience only); music will be added in post-production.\n\n' +
      'camera_and_shot:\n[镜头]';
  }
  story.clips.push({id: `clip_${n}`, prompt, duration: 5.0,
                    seed: 42 + n - 1, seed_mode: 'increment', validated: false});
  renderEditor();
  $('story-raw').value = JSON.stringify(story, null, 2);
}

function formToStory() {
  story.title = $('s-title').value;
  story.resolution = [parseInt($('s-w').value) || 768,
                      parseInt($('s-h').value) || 1344];
  story.steps = parseInt($('s-steps').value) || 8;
  story.context_length = $('s-ctx').value || '22';
}

async function saveStory() {
  if (!current || !story) return;
  formToStory();
  const d = await api(`/projects/${current}/story`, {method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({story})});
  if (!d.ok) { showErr(d); $('save-msg').textContent = ''; return; }
  $('save-msg').textContent = '已保存 ✓';
  setTimeout(() => $('save-msg').textContent = '', 1500);
  $('story-raw').value = JSON.stringify(story, null, 2);
  await refreshClips();
}

function loadRaw() {
  try { story = JSON.parse($('story-raw').value); }
  catch (e) { alert('JSON 解析失败: ' + e.message); return; }
  storyToForm();
}

async function saveRaw() {
  let s;
  try { s = JSON.parse($('story-raw').value); }
  catch (e) { alert('JSON 解析失败: ' + e.message); return; }
  story = s;
  await saveStory();
}

// ---------------------------------------------------------------- refs 上传

async function refreshRefs() {
  if (!current) return;
  const d = await api(`/projects/${current}/refs`);
  const files = d.ok ? d.data.files : [];
  const ds = await api(`/projects/${current}/story`);
  story_refs = ds.ok ? (ds.data.story.refs || []) : [];
  if (story) story.refs = story_refs;
  const ul = $('reflist');
  ul.innerHTML = '';
  if (!files.length) {
    const li = document.createElement('li');
    li.textContent = '（还没有参考图）'; li.style.border = 'none';
    ul.appendChild(li);
    return;
  }
  for (const f of files) {
    const li = document.createElement('li');
    const thumb = document.createElement('img');
    thumb.className = 'thumb';
    thumb.src = `/api/projects/${current}/refs/${encodeURIComponent(f)}`;
    thumb.onclick = () => showRefFull(f);
    const info = document.createElement('span');
    info.style.flex = '1';
    const nameEl = document.createElement('div');
    nameEl.textContent = f;
    const used = story_refs.includes(f);
    const usedEl = document.createElement('div');
    usedEl.style.fontSize = '11px';
    usedEl.style.color = used ? 'var(--ok)' : 'var(--warn)';
    usedEl.textContent = used ? '✓ 在 story.refs' : '未使用';
    info.append(nameEl, usedEl);
    const del = document.createElement('span');
    del.className = 'del'; del.textContent = '✕';
    del.title = '从 story.refs 移除（不删文件）';
    del.onclick = () => removeRef(f);
    li.append(thumb, info, del);
    ul.appendChild(li);
  }
}

function showRefFull(name) {
  $('ref-modal-img').src = `/api/projects/${current}/refs/${encodeURIComponent(name)}`;
  $('ref-modal').style.display = 'flex';
}
let story_refs = [];

async function uploadRefs() {
  if (!current) return;
  const files = $('reffile').files;
  if (!files.length) { $('ref-msg').textContent = '请先选择文件'; return; }
  $('ref-msg').textContent = '上传中…';
  for (const f of files) {
    const fd = new FormData();
    fd.append('file', f);
    const r = await fetch(`/api/projects/${current}/refs`, {method:'POST', body: fd});
    const d = await r.json();
    if (!d.ok) { showErr(d); $('ref-msg').textContent = '失败'; return; }
    log('ref uploaded: ' + d.data.filename);
    // 新文件自动加进 story.refs（未满9张时）
    if (story && !story.refs.includes(d.data.filename) && story.refs.length < 9) {
      story.refs.push(d.data.filename);
      await api(`/projects/${current}/story`, {method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({story})});
    }
  }
  $('reffile').value = '';
  $('ref-msg').textContent = '完成 ✓';
  await loadStory();
  await refreshRefs();
}

async function removeRef(name) {
  if (!story) return;
  story.refs = story.refs.filter(r => r !== name);
  await api(`/projects/${current}/story`, {method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({story})});
  await refreshRefs();
  $('story-raw').value = JSON.stringify(story, null, 2);
}

// ---------------------------------------------------------------- 进度/操作

async function refreshClips() {
  if (!current) return;
  const d = await api(`/projects/${current}/status`);
  if (!d.ok) { showErr(d); return; }
  lastStatusRow = d.data.clips;
  const box = $('clips');
  box.innerHTML = '';
  const STATE_TEXT = {pending: '… 待处理', generating: '⏳ 生成中',
                      generated: '● 已生成·待审', error: '✗ 出错', locked: '✓ 已锁定'};
  for (const c of d.data.clips) {
    const st = c.status || (c.validated ? 'locked' : 'pending');
    const row = document.createElement('div');
    row.className = 'clip-card' + (c.validated ? ' locked' : '');
    const head = document.createElement('div');
    head.className = 'clip-head';
    const state = document.createElement('span');
    state.className = 'st ' + (st === 'locked' ? 'done' : st === 'generated' ? 'gen' : st === 'error' ? 'error' : st === 'generating' ? 'gen' : 'pending');
    state.textContent = STATE_TEXT[st] || st;
    const id = document.createElement('span');
    id.className = 'cid'; id.textContent = c.id;
    const dur = document.createElement('span');
    dur.className = 'hint';
    let timing = c.duration + 's · seed ' + c.seed;
    // final elapsed (B030/DP-105): shown once fixed
    if (c.gen_duration_s != null && st !== 'generating') {
      timing += ' · 用时 ' + fmtElapsed(c.gen_duration_s);
    }
    dur.textContent = timing;
    head.append(state, id, dur);
    // live timer for the generating clip (DP-105)
    if (st === 'generating') {
      const timer = document.createElement('span');
      timer.className = 'timer';
      timer.id = 'gen-timer';
      const t0 = (c.gen_started_at != null) ? c.gen_started_at * 1000 : Date.now();
      timer.textContent = fmtElapsed((Date.now() - t0) / 1000);
      head.appendChild(timer);
      genClockStart = t0;
      if (genClock) clearInterval(genClock);
      genClock = setInterval(() => {
        if (genClockStart == null) return;
        const el = $('gen-timer');
        if (!el) { clearInterval(genClock); genClock = null; return; }
        el.textContent = fmtElapsed((Date.now() - genClockStart) / 1000);
      }, 1000);
    }
    const spacer = document.createElement('span');
    spacer.className = 'spacer';
    const redo = document.createElement('button');
    redo.className = 'mini'; redo.textContent = 'redo';
    redo.onclick = () => doRedo(c.id);
    head.append(spacer, redo);
    row.appendChild(head);
    box.appendChild(row);
  }
  $('progress').textContent = '进度: ' + d.data.validated +
    (d.data.next_clip ? '  下一待处理: ' + d.data.next_clip : '  全部完成');
}

function openEvents() {
  if (es) es.close();
  if (!current) return;
  es = new EventSource(`/api/projects/${current}/events`);
  es.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.type === 'progress') {
      $('progress').textContent =
        `[${d.kind}] clip ${d.index}/${d.total} — ${d.clip}` +
        (d.elapsed_s != null ? ` · ${fmtElapsed(d.elapsed_s)}` : '');
      log(`progress: ${d.clip} (${d.index}/${d.total})` +
          (d.elapsed_s != null ? ` ${d.elapsed_s}s` : ''));
      // status refresh so the generating state shows (B029)
      if (d.kind === 'gen' || d.kind === 'export') refreshClips();
    } else if (d.type === 'done') {
      log('done: ' + (d.message || JSON.stringify(d.files || '')));
      $('progress').textContent = '✓ 完成' +
        (d.gen_duration_s != null ? ` · 生成用时 ${fmtElapsed(d.gen_duration_s)}` : '');
      if (genClock) { clearInterval(genClock); genClock = null; genClockStart = null; }
      // full auto refresh (DP-103): latest video + duration + clip list
      refreshClips();
      if (d.file) {
        playVideo(d.file);
        updatePreviewMeta(d.duration_s);
      } else if (d.files && d.files.length) {
        playVideo(d.files[d.files.length - 1]);
      }
    } else if (d.type === 'error') {
      showErr(d);
      $('progress').textContent = '✗ 出错';
      if (genClock) { clearInterval(genClock); genClock = null; genClockStart = null; }
      refreshClips();
    } else if (d.type === 'task_started') {
      log('task started: ' + d.kind);
      refreshClips();   // enter generating state immediately
    }
  };
}

async function doGen() {
  if (!current) return;
  setBusy(true);
  const d = await api(`/projects/${current}/gen`, {method:'POST'});
  if (!d.ok) { showErr(d); setBusy(false); return; }
  if (d.data.next === 'export') {
    $('progress').textContent = '全部已验证，可直接导出';
    setBusy(false);
  }
  log('gen submitted');
}

async function doKeep() {
  if (!current) return;
  const d = await api(`/projects/${current}/keep?clip=last`, {method:'POST'});
  if (!d.ok) { showErr(d); return; }
  log('keep: ' + d.data.kept + ' (' + d.data.validated + ')');
  await loadStory();
  await refreshClips();
}

async function doRedo(clipId) {
  if (!current) return;
  const clip = clipId || 'last';
  const d = await api(`/projects/${current}/redo?clip=${clip}`, {method:'POST'});
  if (!d.ok) { showErr(d); return; }
  log(`redo: ${d.data.redone} seed→${d.data.new_seed} (后续 ${d.data.affected} 段作废)`);
  await loadStory();
  await refreshClips();
}

async function doExport() {
  if (!current) return;
  setBusy(true);
  const d = await api(`/projects/${current}/export`, {method:'POST'});
  if (!d.ok) { showErr(d); setBusy(false); return; }
  log('export submitted — 未验证片段将逐个补齐后合并全片');
}

function playVideo(fname) {
  const v = $('preview-video');
  // cache-busting timestamp query (B031/DP-103)
  v.src = `/api/projects/${current}/output/${encodeURIComponent(fname)}?t=${Date.now()}`;
  v.autoplay = true;
  v.play().catch(()=>{});
  playFile = fname;
}

function updatePreviewMeta(cumulativeS) {
  const meta = $('preview-meta');
  if (typeof cumulativeS === 'number' && cumulativeS > 0) {
    previewDuration = cumulativeS;
  }
  if (playFile) {
    const dur = previewDuration != null ? ` · 累积 ${previewDuration.toFixed(1)}s` : '';
    meta.textContent = `正在播放：${playFile}${dur}`;
  }
}

function fmtElapsed(s) {
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s / 60), r = s % 60;
  return `${m}:${String(r).padStart(2, '0')}`;
}

function setBusy(b) {
  $('btn-gen').disabled = b;
}

function log(msg) {
  const el = $('log');
  const t = new Date().toTimeString().slice(0, 8);
  el.innerHTML += `[${t}] ${msg}<br>`;
  el.scrollTop = el.scrollHeight;
}

function showErr(d) {
  $('err').textContent = (d.error || '') + '\n' + (d.error_detail || d.detail || '');
  log('error: ' + (d.error || ''));
}

refreshProjects();
</script>
</body>
</html>
